<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Autumn leaves for the "Prochain rendez-vous" block: drawn on the right, warm on aubergine. -->
  <defs>
    <g id="leaf">
      <path d="M0 -20 C12 -13 13 7 0 20 C-13 7 -12 -13 0 -20 Z"/>
      <path d="M0 -17 V22" stroke="#2a1630" stroke-opacity=".35" stroke-width="1.4" fill="none"/>
    </g>
    <g id="maple">
      <path d="M0 -20 L4 -10 L12 -14 L9 -4 L18 -2 L10 4 L13 12 L4 9 L2 16 L0 13 L-2 16 L-4 9 L-13 12 L-10 4 L-18 -2 L-9 -4 L-12 -14 L-4 -10 Z"/>
      <path d="M0 12 L0 24" stroke-width="1.6" fill="none" stroke="currentColor"/>
    </g>
  </defs>
  <g fill-opacity=".9">
    <use href="#maple" transform="translate(262 52) rotate(18) scale(1.7)" fill="#e8743b" color="#e8743b"/>
    <use href="#leaf" transform="translate(300 128) rotate(-35) scale(1.3)" fill="#f2a541"/>
    <use href="#maple" transform="translate(214 150) rotate(-24) scale(1.15)" fill="#c2452d" color="#c2452d"/>
    <use href="#leaf" transform="translate(230 34) rotate(62) scale(.9)" fill="#f2a541"/>
    <use href="#leaf" transform="translate(282 182) rotate(12) scale(1)" fill="#e8743b"/>
    <use href="#maple" transform="translate(176 88) rotate(40) scale(.8)" fill="#f2a541" color="#f2a541"/>
  </g>
  <!-- A few falling: smaller and lighter, drifting left. -->
  <g fill-opacity=".55">
    <use href="#leaf" transform="translate(150 40) rotate(-60) scale(.6)" fill="#e8743b"/>
    <use href="#maple" transform="translate(132 150) rotate(-12) scale(.55)" fill="#f2a541" color="#f2a541"/>
    <use href="#leaf" transform="translate(110 92) rotate(25) scale(.45)" fill="#c2452d"/>
  </g>
</svg>
